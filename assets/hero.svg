<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
  <title id="t">Nitish Galat</title>
  <desc id="d">Forward Deployed AI Engineer based in London, building multi-agent systems, RAG and LLM evals.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2230" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="22%" cy="30%" r="70%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .k{fill:#4b5563;font-size:15px}
      .v{fill:#c9d1d9;font-size:15px}
      .fade{opacity:0;animation:in .8s ease forwards}
      .l1{animation-delay:.3s}.l2{animation-delay:.5s}.l3{animation-delay:.7s}.l4{animation-delay:.9s}
      .rule{transform-origin:left;transform:scaleX(0);animation:grow 1s .2s ease forwards}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .node{animation:pulse 2.4s ease-in-out infinite}
      @keyframes in{to{opacity:1}}
      @keyframes grow{to{transform:scaleX(1)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes pulse{50%{opacity:.35}}
    </style>
  </defs>

  <rect width="1000" height="440" fill="#0d1117"/>
  <rect width="1000" height="440" fill="url(#grid)"/>
  <rect width="1000" height="440" fill="url(#glow)"/>

  <!-- corner brackets -->
  <g fill="none" stroke="#2a3342" stroke-width="2">
    <path d="M24 56V24H56"/><path d="M944 24H976V56"/>
    <path d="M24 384V416H56"/><path d="M944 416H976V384"/>
  </g>

  <!-- name -->
  <g class="sans" font-weight="700" font-size="76">
    <text x="64" y="150" fill="#58a6ff" opacity=".55" filter="url(#soft)">Nitish Galat</text>
    <text x="64" y="150" fill="#e6edf3">Nitish Galat</text>
  </g>
  <rect class="rule" x="64" y="180" width="360" height="3" fill="#58a6ff"/>

  <!-- tagline -->
  <g class="sans" font-size="30" fill="#8b949e">
    <text class="fade l1" x="64" y="236">Agents that ship.</text>
    <text class="fade l2" x="64" y="276">Evals that tell the truth.<tspan class="cursor mono" fill="#58a6ff"> ▌</tspan></text>
  </g>

  <!-- key / value -->
  <g class="mono">
    <g class="fade l2"><text class="k" x="64" y="322">role</text><text class="v" x="176" y="322">forward deployed ai engineer</text></g>
    <g class="fade l3"><text class="k" x="64" y="346">based</text><text class="v" x="176" y="346">london, uk</text></g>
    <g class="fade l4"><text class="k" x="64" y="370">building</text><text class="v" x="176" y="370">multi-agent systems · rag · knowledge graphs</text></g>
    <g class="fade l4"><text class="k" x="64" y="394">also</text><text class="v" x="176" y="394">llm observability · guardrails · fastapi · cloud</text></g>
  </g>

  <!-- graph glyph -->
  <g transform="translate(870 140)">
    <path d="M0 -34L-34 26H34Z" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#58a6ff">
      <circle class="node" cx="0" cy="-34" r="7"/>
      <circle class="node" cx="-34" cy="26" r="7" style="animation-delay:.8s"/>
      <circle class="node" cx="34" cy="26" r="7" style="animation-delay:1.6s"/>
    </g>
  </g>

  <!-- footer -->
  <line x1="64" y1="416" x2="936" y2="416" stroke="#1b2230"/>
  <g class="mono" font-size="12" fill="#3b4453">
    <text x="64" y="408">identity</text>
    <text x="936" y="408" text-anchor="end">github.com/niti007</text>
  </g>
</svg>
